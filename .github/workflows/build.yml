name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Собрать APK
        run: gradle :android:assembleRelease --stacktrace --no-daemon

      - name: Подписать имя файла
        run: cp android/build/outputs/apk/release/android-release.apk "Stikhiya-0.1.${{ github.run_number }}.apk"

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Стихия 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Stikhiya-0.1.${{ github.run_number }}.apk
          make_latest: true
