plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'ru.stikhiya'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.stikhiya'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "0.1.$runNumber"
    }

    // Постоянный ключ: обновления ставятся поверх, без удаления игры
    signingConfigs {
        stikhiya {
            storeFile file('stikhiya.keystore')
            storePassword 'stikhiya'
            keyAlias 'stikhiya'
            keyPassword 'stikhiya'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stikhiya
        }
        debug {
            signingConfig signingConfigs.stikhiya
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
}

// Нативные библиотеки libGDX (.so) достаём из jar-файлов в libs/<abi>
tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a/').mkdirs()
        file('libs/arm64-v8a/').mkdirs()
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (outputDir != null) {
                project.copy {
                    from project.zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}
